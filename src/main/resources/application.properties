spring.application.name=task-management-system

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/task_management}
spring.datasource.username=${DB_USERNAME:task_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=${DB_BASELINE_ON_MIGRATE:false}

app.security.jwt.secret-base64=${JWT_SECRET_BASE64}
app.security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}
